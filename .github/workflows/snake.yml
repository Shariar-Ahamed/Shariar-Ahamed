name: Generate Snake Contribution Grid

on:
  schedule:
    # Run every 6 hours (Optimized auto-update)
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          
          # =========================================================================
          # [OPTION A - ACTIVE]: Save directly to root directory & commit to 'main'
          # =========================================================================
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph SVG
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_activity_graph.py

      - name: Generate top languages SVG
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_top_langs.py

      - name: Generate GitHub stats SVG
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_github_stats.py

      # =========================================================================
      # [OPTION A - ACTIVE]: Commit and push directly to 'main' branch
      # =========================================================================
      - name: Commit and push changes directly to main branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No changes in SVGs to commit."
          else
            git commit -m "chore(stats): auto update contribution snake, activity graph, top langs & github stats [skip ci]"
            git push origin main
          fi

      # =========================================================================
      # [OPTION B - COMMENTED OUT]: Deploy to dedicated 'output' branch
      # To use Option B in future, uncomment lines below and comment out Option A:
      # =========================================================================
      # - name: Deploy snake SVG to output branch
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: ./dist
      #     publish_branch: output
      #     force_orphan: true
