name: Generate Snake Contribution Grid

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          
          # =========================================================================
          # [OPTION A - ACTIVE]: Save directly to root directory & commit to 'main'
          # =========================================================================
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark

          # =========================================================================
          # [OPTION B - COMMENTED OUT]: Save to 'dist' & deploy to 'output' branch
          # To use Option B in future, uncomment lines below and comment out Option A:
          # =========================================================================
          # outputs: |
          #   dist/github-contribution-grid-snake.svg
          #   dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # =========================================================================
      # [OPTION A - ACTIVE]: Commit and push directly to 'main' branch
      # =========================================================================
      - name: Commit and push changes directly to main branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          if git diff --staged --quiet; then
            echo "No changes in snake SVGs to commit."
          else
            git commit -m "chore(snake): auto update contribution snake animation [skip ci]"
            git push origin main
          fi

      # =========================================================================
      # [OPTION B - COMMENTED OUT]: Deploy to dedicated 'output' branch
      # To use Option B in future, uncomment lines below and comment out Option A:
      # =========================================================================
      # - name: Deploy snake SVG to output branch
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: ./dist
      #     publish_branch: output
      #     force_orphan: true
