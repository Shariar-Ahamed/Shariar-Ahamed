<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <defs>
    <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd93f9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bd93f9" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="280" rx="10" fill="#282a36" stroke="#44475a" stroke-width="1"/>

  <!-- Title & Stats -->
  <text x="35" y="42" fill="#ff79c6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">
    Activity Graph
  </text>
  <text x="35" y="65" fill="#f8f8f2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" opacity="0.8">
    Recent Contribution Activity (31 Days)
  </text>

  <!-- Grid Horizontal Lines -->
  <g stroke="#383a59" stroke-width="1" stroke-dasharray="3,3">
    <line x1="50" y1="90" x2="750" y2="90" />
    <line x1="50" y1="130" x2="750" y2="130" />
    <line x1="50" y1="170" x2="750" y2="170" />
    <line x1="50" y1="210" x2="750" y2="210" />
  </g>

  <!-- Area Fill Under Curve -->
  <path d="M 50 210 L 50 205 Q 110 200, 160 185 T 280 150 T 400 110 T 520 85 T 640 120 T 750 140 L 750 210 Z" fill="url(#areaGradient)" />

  <!-- Smooth Activity Line -->
  <path d="M 50 205 Q 110 200, 160 185 T 280 150 T 400 110 T 520 85 T 640 120 T 750 140" fill="none" stroke="#bd93f9" stroke-width="3" filter="url(#glow)"/>

  <!-- Data Points -->
  <circle cx="50" cy="205" r="4" fill="#ff79c6" stroke="#282a36" stroke-width="2"/>
  <circle cx="160" cy="185" r="4" fill="#ff79c6" stroke="#282a36" stroke-width="2"/>
  <circle cx="280" cy="150" r="4" fill="#ff79c6" stroke="#282a36" stroke-width="2"/>
  <circle cx="400" cy="110" r="5" fill="#50fa7b" stroke="#282a36" stroke-width="2"/>
  <circle cx="520" cy="85" r="5" fill="#50fa7b" stroke="#282a36" stroke-width="2"/>
  <circle cx="640" cy="120" r="4" fill="#ff79c6" stroke="#282a36" stroke-width="2"/>
  <circle cx="750" cy="140" r="4" fill="#ff79c6" stroke="#282a36" stroke-width="2"/>

  <!-- Bottom Axis & Date Labels -->
  <line x1="50" y1="215" x2="750" y2="215" stroke="#6272a4" stroke-width="1.5"/>
  <g fill="#6272a4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">
    <text x="50" y="235">Day 1</text>
    <text x="190" y="235">Day 8</text>
    <text x="330" y="235">Day 15</text>
    <text x="470" y="235">Day 22</text>
    <text x="610" y="235">Day 28</text>
    <text x="750" y="235">Day 31</text>
  </g>
</svg>
