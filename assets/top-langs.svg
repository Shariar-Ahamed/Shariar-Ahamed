<svg xmlns="http://www.w3.org/2000/svg" width="350" height="200" viewBox="0 0 350 200">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Clip path to round the progress bar neatly -->
    <clipPath id="bar-clip">
      <rect x="25" y="65" width="300" height="8" rx="4" ry="4"/>
    </clipPath>
  </defs>

  <!-- Card Background (Identical to Activity Graph) -->
  <rect width="350" height="200" rx="10" fill="#282a36" stroke="#44475a" stroke-width="1"/>

  <!-- Title & Subtitle (Identical to Activity Graph) -->
  <text x="25" y="34" fill="#ff79c6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">
    Most Used Languages
  </text>
  <text x="25" y="52" fill="#f8f8f2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" opacity="0.75">
    Calculated from personal repositories
  </text>

  <!-- Progress Bar (Clipped) -->
  <g clip-path="url(#bar-clip)">
    <!-- Base Background -->
    <rect x="25" y="65" width="300" height="8" fill="#1e1f29"/>
    <rect x="25.0" y="65" width="139.3" height="8" fill="#f1fa8c" /><rect x="164.3" y="65" width="60.9" height="8" fill="#ffb86c" /><rect x="225.2" y="65" width="44.8" height="8" fill="#8be9fd" /><rect x="270.0" y="65" width="23.1" height="8" fill="#6272a4" /><rect x="293.1" y="65" width="18.6" height="8" fill="#50fa7b" /><rect x="311.7" y="65" width="6.2" height="8" fill="#8be9fd" /><rect x="317.9" y="65" width="5.5" height="8" fill="#ff79c6" /><rect x="323.4" y="65" width="2.5" height="8" fill="#bd93f9" /><rect x="325.9" y="65" width="2.5" height="8" fill="#ff5555" />
  </g>

  <!-- Languages List (2 Columns) -->
  <g>
    
    <g transform="translate(0, 98)">
      <circle cx="30" cy="0" r="4" fill="#f1fa8c" stroke="#282a36" stroke-width="1.5" filter="url(#glow)"/>
      <text x="42" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#f8f8f2">
        JavaScript
      </text>
      <text x="155" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#f1fa8c" text-anchor="end">
        46.43%
      </text>
    </g>
    <g transform="translate(0, 121)">
      <circle cx="30" cy="0" r="4" fill="#ffb86c" stroke="#282a36" stroke-width="1.5" filter="url(#glow)"/>
      <text x="42" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#f8f8f2">
        HTML
      </text>
      <text x="155" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#ffb86c" text-anchor="end">
        20.3%
      </text>
    </g>
    <g transform="translate(0, 144)">
      <circle cx="30" cy="0" r="4" fill="#8be9fd" stroke="#282a36" stroke-width="1.5" filter="url(#glow)"/>
      <text x="42" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#f8f8f2">
        CSS
      </text>
      <text x="155" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#8be9fd" text-anchor="end">
        14.95%
      </text>
    </g>
    <g transform="translate(0, 167)">
      <circle cx="30" cy="0" r="4" fill="#6272a4" stroke="#282a36" stroke-width="1.5" filter="url(#glow)"/>
      <text x="42" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#f8f8f2">
        C
      </text>
      <text x="155" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#6272a4" text-anchor="end">
        7.7%
      </text>
    </g>
    <g transform="translate(0, 190)">
      <circle cx="30" cy="0" r="4" fill="#50fa7b" stroke="#282a36" stroke-width="1.5" filter="url(#glow)"/>
      <text x="42" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#f8f8f2">
        Python
      </text>
      <text x="155" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#50fa7b" text-anchor="end">
        6.21%
      </text>
    </g>
    
    <g transform="translate(0, 98)">
      <circle cx="180" cy="0" r="4" fill="#8be9fd" stroke="#282a36" stroke-width="1.5" filter="url(#glow)"/>
      <text x="192" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#f8f8f2">
        Jupyter Notebook
      </text>
      <text x="320" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#8be9fd" text-anchor="end">
        2.06%
      </text>
    </g>
    <g transform="translate(0, 121)">
      <circle cx="180" cy="0" r="4" fill="#ff79c6" stroke="#282a36" stroke-width="1.5" filter="url(#glow)"/>
      <text x="192" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#f8f8f2">
        C++
      </text>
      <text x="320" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#ff79c6" text-anchor="end">
        1.83%
      </text>
    </g>
    <g transform="translate(0, 144)">
      <circle cx="180" cy="0" r="4" fill="#bd93f9" stroke="#282a36" stroke-width="1.5" filter="url(#glow)"/>
      <text x="192" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#f8f8f2">
        Java
      </text>
      <text x="320" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#bd93f9" text-anchor="end">
        0.29%
      </text>
    </g>
    <g transform="translate(0, 167)">
      <circle cx="180" cy="0" r="4" fill="#ff5555" stroke="#282a36" stroke-width="1.5" filter="url(#glow)"/>
      <text x="192" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#f8f8f2">
        Shell
      </text>
      <text x="320" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#ff5555" text-anchor="end">
        0.24%
      </text>
    </g>
  </g>
</svg>
