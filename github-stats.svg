    <!-- Subtitle below circle -->
    <text x="0" y="56" fill="#50fa7b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.8px">
